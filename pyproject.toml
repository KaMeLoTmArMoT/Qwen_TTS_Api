[project]
name = "quen-tts"
version = "0.1.0"
description = "FastAPI service wrapping Qwen3-TTS for speech synthesis"
readme = "README.md"
authors = [
    { name = "KaMeLoTmArMoT", email = "andyshebeko@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub[cli]>=0.36.2",
    "qwen-tts>=0.1.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pytest>=8.0.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length
    "B008", # FastAPI dependency injection
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]

